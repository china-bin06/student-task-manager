name: student-task-manager

services:
  api:
    restart: unless-stopped
    build:
      context: .
    image: student-task-api:dev
    env_file:
      - .env.api
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
        
  postgres:
    restart: unless-stopped
    image: postgres:18
    env_file:
      - .env.postgres
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
